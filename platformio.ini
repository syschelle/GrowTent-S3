; PlatformIO Project Configuration File
;
; GrowTent-S3 firmware for the Waveshare ESP32-S3-Relay-6CH board.
; First installation on a new ESP32-S3 board should be done via USB erase + upload,
; because OTA cannot safely replace bootloader/partition table between ESP32 families.

[env:esp32-s3-relay-6ch]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
board_build.flash_mode = dio

build_flags =
  -DGT_BOARD_ESP32_S3_RELAY_6CH=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_FREERTOS_CHECK_STACKOVERFLOW=2
  -DI2C_SDA=8
  -DI2C_SCL=9
  -DDS18B20_PIN=4
  -DSTATUS_LED_PIN=-1
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

lib_deps =
  ArduinoJson
  adafruit/Adafruit BME280 Library
  adafruit/Adafruit Unified Sensor
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^3.11.0
